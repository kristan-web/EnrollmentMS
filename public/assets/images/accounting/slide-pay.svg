<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="Paying school fees from a phone using an e-wallet">
  <defs>
    <linearGradient id="pBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e46a8"/>
      <stop offset="55%" stop-color="#16244f"/>
      <stop offset="100%" stop-color="#0b1533"/>
    </linearGradient>
    <linearGradient id="pBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37cdff"/>
      <stop offset="100%" stop-color="#2f5fd0"/>
    </linearGradient>
    <filter id="pShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#050b20" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="440" fill="url(#pBg)"/>
  <circle cx="1050" cy="60" r="210" fill="#37cdff" opacity="0.10"/>
  <circle cx="880" cy="420" r="170" fill="#2f5fd0" opacity="0.20"/>

  <!-- phone -->
  <g filter="url(#pShadow)" transform="translate(690 42)">
    <rect x="0" y="0" width="224" height="356" rx="30" fill="#ffffff"/>
    <rect x="12" y="14" width="200" height="328" rx="21" fill="#f7faff"/>
    <rect x="82" y="24" width="60" height="8" rx="4" fill="#c9d8f0"/>

    <rect x="28" y="50" width="168" height="84" rx="14" fill="#16244f"/>
    <rect x="42" y="66" width="52" height="7" rx="3.5" fill="#7f97c9"/>
    <rect x="42" y="84" width="102" height="14" rx="5" fill="#ffffff" opacity="0.92"/>
    <rect x="42" y="108" width="76" height="7" rx="3.5" fill="#4d68a8"/>
    <circle cx="172" cy="76" r="11" fill="#37cdff" opacity="0.85"/>

    <g fill="#dbe6f8">
      <rect x="28" y="152" width="168" height="11" rx="5.5"/>
      <rect x="28" y="180" width="168" height="11" rx="5.5"/>
      <rect x="28" y="208" width="122" height="11" rx="5.5"/>
    </g>
    <g fill="#2f5fd0" opacity="0.55">
      <rect x="152" y="152" width="44" height="11" rx="5.5"/>
      <rect x="152" y="180" width="44" height="11" rx="5.5"/>
    </g>

    <rect x="28" y="250" width="168" height="42" rx="13" fill="url(#pBtn)"/>
    <rect x="80" y="265" width="64" height="12" rx="6" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- e-wallet chips -->
  <g filter="url(#pShadow)">
    <rect x="960" y="86" width="152" height="58" rx="17" fill="#ffffff"/>
    <circle cx="994" cy="115" r="14" fill="#007dfe"/>
    <rect x="1020" y="108" width="66" height="14" rx="7" fill="#16244f" opacity="0.18"/>
  </g>
  <g filter="url(#pShadow)">
    <rect x="984" y="188" width="152" height="58" rx="17" fill="#ffffff"/>
    <circle cx="1018" cy="217" r="14" fill="#00b14f"/>
    <rect x="1044" y="210" width="66" height="14" rx="7" fill="#16244f" opacity="0.18"/>
  </g>
  <g filter="url(#pShadow)">
    <rect x="960" y="290" width="152" height="58" rx="17" fill="#ffffff"/>
    <rect x="978" y="310" width="28" height="20" rx="5" fill="#16244f"/>
    <rect x="1018" y="312" width="66" height="14" rx="7" fill="#16244f" opacity="0.18"/>
  </g>

  <g fill="#37cdff" opacity="0.6">
    <circle cx="940" cy="115" r="5"/>
    <circle cx="940" cy="217" r="5"/>
    <circle cx="940" cy="319" r="5"/>
  </g>

  <g fill="#ffffff" opacity="0.12" font-family="Space Grotesk, system-ui, sans-serif" font-weight="700">
    <text x="612" y="130" font-size="72">₱</text>
    <text x="1136" y="410" font-size="52">₱</text>
  </g>
</svg>
