<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="A statement of account showing the breakdown of school fees">
  <defs>
    <linearGradient id="sBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24408c"/>
      <stop offset="60%" stop-color="#16244f"/>
      <stop offset="100%" stop-color="#0d1838"/>
    </linearGradient>
    <linearGradient id="sTotal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b3d7c"/>
      <stop offset="100%" stop-color="#0b1533"/>
    </linearGradient>
    <filter id="sShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#050b20" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="440" fill="url(#sBg)"/>
  <circle cx="1080" cy="70" r="190" fill="#37cdff" opacity="0.10"/>
  <circle cx="900" cy="430" r="180" fill="#2f5fd0" opacity="0.18"/>

  <!-- statement sheet -->
  <g filter="url(#sShadow)" transform="translate(660 34)">
    <rect x="0" y="0" width="404" height="372" rx="24" fill="#ffffff"/>

    <rect x="30" y="32" width="136" height="13" rx="6.5" fill="#16244f"/>
    <rect x="30" y="54" width="94" height="9" rx="4.5" fill="#2f5fd0" opacity="0.4"/>
    <circle cx="354" cy="46" r="20" fill="#2f5fd0" opacity="0.12"/>
    <path d="M347 46l5 5 11-11" fill="none" stroke="#2f5fd0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="30" y1="84" x2="374" y2="84" stroke="#16244f" stroke-opacity="0.1" stroke-width="2"/>

    <g>
      <rect x="30" y="104" width="114" height="10" rx="5" fill="#16244f" opacity="0.8"/>
      <rect x="298" y="104" width="76" height="10" rx="5" fill="#2f5fd0" opacity="0.5"/>
      <rect x="30" y="122" width="74" height="6.5" rx="3.25" fill="#16244f" opacity="0.28"/>
    </g>
    <line x1="30" y1="146" x2="374" y2="146" stroke="#16244f" stroke-opacity="0.08" stroke-width="2"/>
    <g>
      <rect x="30" y="166" width="138" height="10" rx="5" fill="#16244f" opacity="0.8"/>
      <rect x="310" y="166" width="64" height="10" rx="5" fill="#2f5fd0" opacity="0.5"/>
      <rect x="30" y="184" width="86" height="6.5" rx="3.25" fill="#16244f" opacity="0.28"/>
    </g>
    <line x1="30" y1="208" x2="374" y2="208" stroke="#16244f" stroke-opacity="0.08" stroke-width="2"/>
    <g>
      <rect x="30" y="228" width="102" height="10" rx="5" fill="#16244f" opacity="0.8"/>
      <rect x="320" y="228" width="54" height="10" rx="5" fill="#2f5fd0" opacity="0.5"/>
      <rect x="30" y="246" width="108" height="6.5" rx="3.25" fill="#16244f" opacity="0.28"/>
    </g>

    <rect x="30" y="278" width="344" height="70" rx="16" fill="url(#sTotal)"/>
    <rect x="50" y="300" width="94" height="8" rx="4" fill="#dfe8ff" opacity="0.75"/>
    <rect x="50" y="318" width="60" height="6.5" rx="3.25" fill="#7f97c9" opacity="0.7"/>
    <text x="354" y="324" text-anchor="end" font-family="Roboto Mono, ui-monospace, monospace" font-size="27" font-weight="700" fill="#ffffff">₱19,300</text>
  </g>

  <!-- magnifier -->
  <g filter="url(#sShadow)" transform="translate(596 250)">
    <circle cx="52" cy="52" r="50" fill="#ffffff" opacity="0.96"/>
    <circle cx="52" cy="52" r="35" fill="none" stroke="#2f5fd0" stroke-width="6.5"/>
    <line x1="78" y1="78" x2="110" y2="110" stroke="#2f5fd0" stroke-width="11" stroke-linecap="round"/>
    <text x="52" y="64" text-anchor="middle" font-family="Space Grotesk, system-ui, sans-serif" font-size="30" font-weight="700" fill="#2f5fd0">₱</text>
  </g>

  <!-- tags -->
  <g filter="url(#sShadow)">
    <rect x="1078" y="132" width="104" height="48" rx="14" fill="#ffffff"/>
    <circle cx="1104" cy="156" r="11" fill="#f4b301"/>
    <rect x="1122" y="150" width="46" height="11" rx="5.5" fill="#16244f" opacity="0.2"/>
  </g>
  <g filter="url(#sShadow)">
    <rect x="1090" y="220" width="96" height="48" rx="14" fill="#ffffff"/>
    <circle cx="1116" cy="244" r="11" fill="#16a34a"/>
    <rect x="1134" y="238" width="38" height="11" rx="5.5" fill="#16244f" opacity="0.2"/>
  </g>
</svg>
