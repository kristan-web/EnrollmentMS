<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers</title>
    <link rel="stylesheet" href="../src/bootstrap/bootstrap.min.css">
</head>
<body>
    <div class="container my-4">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                Teachers
                <a href="teacher-page.html" class="btn btn-primary btn-sm">Add Teacher</a>
            </div>
            <div class="card-body">

                <!-- Filters -->
                <div class="row g-2 mb-3">

                    <div class="col-md-6">
                        <input type="text" class="form-control" id="keyword" placeholder="Search by name or email">
                    </div>

                    <div class="col-md-4">
                        <select class="form-select" id="specialization_filter">
                            <option value="">All Specializations</option>
                        </select>
                    </div>

                </div>

                <div class="mb-2">
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="clearFilters">
                        Clear Filters
                    </button>
                </div>

                <!-- Results -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Contact No.</th>
                                <th>Specialization</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="teachersTableBody">
                            <tr>
                                <td colspan="6" class="text-center text-muted">Loading teachers...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script src="../src/jquery-4.0.0.min.js"></script>
    <script src="../js/TeachersList.js"></script>
</body>
</html>
