<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Teacher</title>
    <link rel="stylesheet" href="../src/bootstrap/bootstrap.min.css">
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="card w-50 mx-auto my-4">
            <div class="card-header">
                Edit Teacher
            </div>
            <div class="card-body">

                <div id="formAlert" class="alert alert-danger d-none"></div>

                <form id="teacherEditForm">

                    <input type="hidden" id="teacher_id">

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="first_name" required>
                        <label>First Name</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="last_name" required>
                        <label>Last Name</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" required>
                        <label>Email</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="contact_number" maxlength="15" required>
                        <label>Contact Number</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="specialization" required>
                        <label>Specialization</label>
                    </div>

                    <div class="mb-3">
                        <label>Status</label>
                        <select class="form-select" id="status">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            Save Changes
                        </button>
                        <a href="teachers-list.html" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="../src/jquery-4.0.0.min.js"></script>
    <script src="../js/TeacherEdit.js"></script>
</body>
</html>
