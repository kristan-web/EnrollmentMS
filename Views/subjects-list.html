<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects</title>
    <link rel="stylesheet" href="../src/bootstrap/bootstrap.min.css">
</head>
<body>
    <div class="container my-4">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                Subjects
                <a href="subject-add.html" class="btn btn-primary btn-sm">Add Subject</a>
            </div>
            <div class="card-body">

                <!-- Filters -->
                <div class="row g-2 mb-2">

                    <div class="col-md-4">
                        <input type="text" class="form-control" id="keyword" placeholder="Search by code or name">
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" id="subject_type_filter">
                            <option value="">All Types</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" id="grade_level_filter">
                            <option value="">All Grade Levels</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" id="semester_filter">
                            <option value="">All Semesters</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" id="strand_filter">
                            <option value="">All Strands</option>
                        </select>
                    </div>

                </div>

                <div class="row g-2 mb-3">

                    <div class="col-md-2">
                        <select class="form-select" id="status_filter">
                            <option value="Active" selected>Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <button type="button" class="btn btn-outline-secondary w-100" id="clearFilters">
                            Clear Filters
                        </button>
                    </div>

                </div>

                <!-- Results -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Grade</th>
                                <th>Semester</th>
                                <th>Units</th>
                                <th>Strand</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="subjectsTableBody">
                            <tr>
                                <td colspan="9" class="text-center text-muted">Loading subjects...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script src="../src/jquery-4.0.0.min.js"></script>
    <script src="../js/SubjectsList.js"></script>
</body>
</html>
